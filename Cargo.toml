[package]
name = "tuna-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Open tuna.am tunnels from Rust code"
repository = "https://github.com/yuccastream/tuna-sdk-rust"
homepage = "https://tuna.am"
readme = "README.md"
keywords = ["tunnel", "tuna", "ssh", "webhook"]
categories = ["network-programming"]
exclude = [".github"]

[lib]
name = "tuna_sdk"

[dependencies]
russh = { version = "0.65.4", default-features = false, features = ["ring", "rsa"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt", "sync", "time", "macros", "io-util"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[[example]]
name = "runner"
test = true
